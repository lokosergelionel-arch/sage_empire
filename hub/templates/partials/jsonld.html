{% load static %}<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "LocalBusiness",
      "@id": "{{ SITE_URL }}/#organization",
      "name": "SAGE EMPIRE",
      "url": "{{ SITE_URL }}/",
      "logo": "{{ SITE_URL }}{% static 'images/logo.png' %}",
      "image": "{{ SITE_URL }}{% static 'images/logo.png' %}",
      "telephone": "+22897070509",
      "email": "contacts@sage-empire.com",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Lomé",
        "addressCountry": "TG"
      },
      "areaServed": [
        {"@type": "City", "name": "Lomé"},
        {"@type": "Country", "name": "Togo"}
      ]
    },
    {
      "@type": "WebSite",
      "@id": "{{ SITE_URL }}/#website",
      "url": "{{ SITE_URL }}/",
      "name": "SAGE EMPIRE",
      "inLanguage": "fr",
      "publisher": {"@id": "{{ SITE_URL }}/#organization"}
    }{% if jsonld_crumb %},
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        {"@type": "ListItem", "position": 1, "name": "Accueil", "item": "{{ SITE_URL }}/"}{% if jsonld_parent_name %},
        {"@type": "ListItem", "position": 2, "name": "{{ jsonld_parent_name|escapejs }}", "item": "{{ SITE_URL }}{{ jsonld_parent_url }}"},
        {"@type": "ListItem", "position": 3, "name": "{{ jsonld_crumb|escapejs }}", "item": "{{ SITE_URL }}{{ request.path }}"}{% else %},
        {"@type": "ListItem", "position": 2, "name": "{{ jsonld_crumb|escapejs }}", "item": "{{ SITE_URL }}{{ request.path }}"}{% endif %}
      ]
    }{% endif %}{% if jsonld_gallery %},
    {
      "@type": "CollectionPage",
      "name": "Réalisations événementielles SAGE EMPIRE",
      "url": "{{ SITE_URL }}{{ request.path }}",
      "inLanguage": "fr",
      "isPartOf": {"@id": "{{ SITE_URL }}/#website"},
      "mainEntity": {
        "@type": "ItemList",
        "itemListElement": [
          {"@type": "ListItem", "position": 1, "item": {"@type": "ImageGallery", "name": "Coup de Cœur", "image": "{{ SITE_URL }}{% static 'images/coupdecoeur_01.jpg' %}"}},
          {"@type": "ListItem", "position": 2, "item": {"@type": "ImageGallery", "name": "White Party", "image": "{{ SITE_URL }}{% static 'images/whiteparty_01.jpg' %}"}},
          {"@type": "ListItem", "position": 3, "item": {"@type": "ImageGallery", "name": "Showcase Novimed", "image": "{{ SITE_URL }}{% static 'images/novimed_01.jpg' %}"}}
        ]
      }
    }{% endif %}
  ]
}
</script>
